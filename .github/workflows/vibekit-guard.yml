name: vibekit-guard
on:
  pull_request:
  push:
    branches: [main]

jobs:
  vibe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @windhelm/db generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Run script tests
        run: node --test scripts/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure vibe-kit
        run: |
          if [ -f scripts/vibe.py ]; then
            python3 scripts/vibe.py configure --apply
          else
            echo "scripts/vibe.py not found; skipping vibe-kit steps."
          fi
      - name: Run vibe doctor
        run: |
          if [ -f scripts/vibe.py ]; then
            python3 scripts/vibe.py doctor --full
          else
            echo "scripts/vibe.py not found; skipping vibe doctor."
          fi
      - name: Validate agent instructions
        run: |
          if [ -f scripts/vibe.py ]; then
            python3 scripts/vibe.py agents doctor --fail
          else
            echo "scripts/vibe.py not found; skipping agent instructions validation."
          fi
